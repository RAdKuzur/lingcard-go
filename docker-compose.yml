services:
  db:
    image: postgres:17
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    networks:
      - network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}" ]
      interval: 30s
      timeout: 10s
      retries: 3

  redis:
    image: redis:latest
    restart: always
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: run server/main.go
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      migrator:
        condition: service_completed_successfully
    networks:
      - network

  migrator:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: run migrate.go
    depends_on:
      db:
        condition: service_healthy
    networks:
      - network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:5173:5173"
    command: preview -- --host --port 5173
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/dist
    networks:
      - network

volumes:
  redis_data:
  postgres_data:

networks:
  network:
    driver: bridge